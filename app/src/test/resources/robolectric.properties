# Robolectric runs at API 34 (Android 14) rather than the JVM default.
#
# Two reasons, and the second is the important one:
#
#  * API 34 is what the app targets (`compileSdk`/`targetSdk` = 34 in app/build.gradle.kts), so a
#    test that passes here is a test that ran against the platform contract the app ships with.
#  * The device this app is installed on reports Android 14/15, and the reported failure is a
#    launch crash that no API-33 run could reproduce. A Robolectric SDK that is older than the
#    device cannot see behaviour the platform added after it.
#
# The jar is resolved offline from `robolectric.dependency.dir` (see app/build.gradle.kts), so this
# costs no network access: `android-all-instrumented-14-robolectric-10818077-i6.jar` is the artifact
# Robolectric 4.12.1 asks for at this API level.
sdk=34
